<style>
/* Layout: coin search, collapsible settings, sticky scan bar, one collapsed card per coin */
:root{
  --bg:#eef1f4; --panel:#ffffff; --fg:#111820; --muted:#5d6975; --line:#d6dce2;
  --accent:#0f766e; --va:#9fd3cc; --bull:#15803d; --bullbg:#dcfce7; --bear:#b91c1c; --bearbg:#fee2e2; --gold:#a16207; --goldbg:#fef3c7;
  --display:"Archivo",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
/* palettes, light values */
:root[data-pal="blue"]{--accent:#1d4ed8;--va:#bcd0fa}
:root[data-pal="violet"]{--accent:#6d28d9;--va:#d6c6f7}
:root[data-pal="amber"]{--accent:#b45309;--va:#f6d6a8}
:root[data-pal="rose"]{--accent:#be123c;--va:#f8c3cf}
/* dark theme: follows the device unless Light is chosen, or forced by Dark */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1117; --panel:#151b23; --fg:#e6edf3; --muted:#8b96a3; --line:#27313c;
  --accent:#2dd4bf; --va:#1d5e57; --bull:#4ade80; --bullbg:#0f2a1a; --bear:#f87171; --bearbg:#2c1214; --gold:#fbbf24; --goldbg:#2d230a; color-scheme:dark}
  :root[data-pal="blue"]:not([data-theme="light"]){--accent:#60a5fa;--va:#1e3a6e}
  :root[data-pal="violet"]:not([data-theme="light"]){--accent:#a78bfa;--va:#3b2a6b}
  :root[data-pal="amber"]:not([data-theme="light"]){--accent:#fbbf24;--va:#5a4113}
  :root[data-pal="rose"]:not([data-theme="light"]){--accent:#fb7185;--va:#5e1f2e}}
:root[data-theme="dark"]{
  --bg:#0d1117; --panel:#151b23; --fg:#e6edf3; --muted:#8b96a3; --line:#27313c;
  --accent:#2dd4bf; --va:#1d5e57; --bull:#4ade80; --bullbg:#0f2a1a; --bear:#f87171; --bearbg:#2c1214; --gold:#fbbf24; --goldbg:#2d230a; color-scheme:dark}
:root[data-theme="dark"][data-pal="blue"]{--accent:#60a5fa;--va:#1e3a6e}
:root[data-theme="dark"][data-pal="violet"]{--accent:#a78bfa;--va:#3b2a6b}
:root[data-theme="dark"][data-pal="amber"]{--accent:#fbbf24;--va:#5a4113}
:root[data-theme="dark"][data-pal="rose"]{--accent:#fb7185;--va:#5e1f2e}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--display);-webkit-tap-highlight-color:transparent}
.wrap{max-width:720px;margin:0 auto;padding-block:12px 40px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));display:grid;gap:12px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.gear{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg)}
.gear[aria-expanded="true"]{border-color:var(--accent);color:var(--accent)}
.gear svg{width:20px;height:20px}
.hbtns{display:flex;gap:8px}
.regime{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rt{display:grid;gap:3px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 10px;color:var(--fg);font:inherit;min-width:0}
.rt[aria-expanded="true"]{border-color:var(--accent)}
.rh{display:flex;align-items:center;gap:6px;font:700 12px var(--display);color:var(--muted)}
.rh svg{width:15px;height:15px}
.ri{font:800 13px var(--display)}
.rst{font:800 14px/1.2 var(--display)}
.rst.up{color:var(--bull)} .rst.down{color:var(--bear)} .rst.side{color:var(--gold)}
.rx{font:11px var(--mono);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stylebar{display:grid;gap:6px;font-size:12.5px;color:var(--muted);margin:-2px 2px 10px}
.sbl{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.regd{display:grid;gap:4px;font-size:13px}
.regd b{font-weight:700}
.lp{font:600 13px var(--mono);margin-left:10px;padding:1px 6px;border-radius:5px;font-variant-numeric:tabular-nums}
@keyframes up{from{background:var(--bullbg);color:var(--bull)}to{background:transparent}}
@keyframes dn{from{background:var(--bearbg);color:var(--bear)}to{background:transparent}}
.tick-up{animation:up 1s ease-out}.tick-dn{animation:dn 1s ease-out}
.plan2{display:grid;gap:2px;padding:10px 12px;border-radius:10px;background:var(--bg)}
.rec{font:12.5px/1.4 var(--display);color:var(--muted);padding:2px 0 4px}
.rec b{color:var(--fg)}
.eo{gap:0}
.eor{padding:7px 0;border-bottom:1px solid var(--line)}
.eor:last-child{border-bottom:0}
.eoh{display:flex;justify-content:space-between;gap:8px;font:600 13px var(--display)}
.eor.pick .eoh{color:var(--accent);font-weight:800}
.eos{font:600 12px var(--mono);color:var(--muted);text-align:right}
.eod{font:12px var(--mono);color:var(--muted);margin-top:2px}
.dr{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dr label{display:grid;gap:4px;min-width:0}
.late{font:600 12.5px var(--display);color:var(--gold);background:var(--goldbg);border-radius:8px;padding:6px 8px;margin-top:6px}
.tr{font:600 12.5px var(--display);color:var(--fg);padding:2px 0 6px}
.ph{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:4px;font-size:12.5px}
.pr{display:grid;grid-template-columns:84px 96px 1fr;gap:8px;align-items:baseline;padding:5px 0;border-bottom:1px solid var(--line)}
.pr:last-of-type{border-bottom:0}
.pk{font:600 12px var(--display);color:var(--muted)}
.pv{font:700 14px var(--mono);font-variant-numeric:tabular-nums}
.pv.pos{color:var(--bull)} .pv.neg{color:var(--bear)}
.pn{font:12px var(--display);color:var(--muted);min-width:0}
.pt{font:12px var(--mono);color:var(--muted);padding-top:6px}
.ladder{display:grid}
.lvtf .chip{min-height:32px;padding:5px 10px;font-size:12px}
.lr{display:grid;grid-template-columns:1fr auto 58px;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.lr span:nth-child(2){font:600 13px var(--mono);font-variant-numeric:tabular-nums}
.lr span:nth-child(3){font:12px var(--mono);text-align:right}
.lr em{font-style:normal;color:var(--muted);font-size:11.5px}
.lr.hl span:first-child{color:var(--accent);font-weight:700}
.lr.now{background:var(--bg);border-radius:6px;padding:7px 8px;margin:2px -8px;border-bottom:0;font-weight:700}
.status.err{color:var(--bear)}

.mode{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:700 13px var(--display)}
.mode .dot{width:8px;height:8px;border-radius:50%;background:var(--bull);box-shadow:0 0 0 3px var(--bullbg)}
.mode[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.mode[aria-pressed="true"] .dot{background:var(--gold);box-shadow:0 0 0 3px var(--goldbg)}
body.btmode #scan{background:var(--gold)}
body.btmode #btBar{border-color:var(--gold)}
.field{width:100%;min-width:0;font:600 15px var(--mono);padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg)}
.fee{display:flex;align-items:center;gap:6px;font:600 14px var(--mono)}
.fee input{width:84px;text-align:center}
.btn:disabled{opacity:.6}
.tablewrap{overflow-x:auto}
table.bt{width:100%;border-collapse:collapse;font:12.5px var(--mono);font-variant-numeric:tabular-nums}
table.bt th,table.bt td{padding:6px 4px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
table.bt th{font:600 10px var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
table.bt th:first-child,table.bt td:first-child{text-align:left}
.pos{color:var(--bull)} .neg{color:var(--bear)}
.btsum{display:grid;gap:10px}
.outc{display:grid;gap:3px;font:12px var(--mono);background:var(--bg);border-radius:10px;padding:8px 10px}
.mai{position:relative}
.mai input{width:100%;padding-right:28px}
.rs{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:24px;height:24px;display:grid;place-items:center;border-radius:50%;border:0;background:var(--bg);color:var(--accent);font:700 14px/1 var(--display);padding:0}
.btn{font:700 14px var(--display);padding:10px;border-radius:10px;border:1px solid var(--accent);background:transparent;color:var(--accent);width:100%;margin-top:12px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);padding:0}
.sw[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 2px var(--panel) inset}
h1{font:800 22px var(--display);margin:0;letter-spacing:-.01em}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.chomper{width:52px;height:32px;flex:none;overflow:visible}
.c-body{fill:var(--accent)} .c-tooth{fill:var(--fg)} .c-eye{fill:var(--bg)} .c-red{fill:var(--bear)}
.jaw-top,.jaw-bot,.c-candles{transition:transform .2s}
.wm{display:grid;line-height:1;font-family:"Silkscreen",ui-monospace,monospace;white-space:nowrap}
.wm span{font-size:11px;letter-spacing:.32em;color:var(--muted)}
.wm b{font-size:19px;font-weight:700;letter-spacing:.06em;color:var(--fg)}
@keyframes jawT{0%,100%{transform:translateY(0)}50%{transform:translateY(12px)}}
@keyframes jawB{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes feed{0%{transform:translateX(0);opacity:1}80%{transform:translateX(-22px);opacity:0}100%{transform:translateX(0);opacity:0}}
body.chomping .jaw-top{animation:jawT .45s steps(2,jump-none) infinite}
body.chomping .jaw-bot{animation:jawB .45s steps(2,jump-none) infinite}
body.chomping .c-candles{animation:feed 1.35s steps(6) infinite}
@media (prefers-reduced-motion:reduce){body.chomping .jaw-top,body.chomping .jaw-bot,body.chomping .c-candles{animation:none}}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;font:600 16px var(--mono);text-transform:uppercase;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg)}
.search button{font:700 15px var(--display);padding:0 18px;border-radius:10px;border:1px solid var(--accent);background:transparent;color:var(--accent)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
summary{list-style:none;cursor:pointer}
summary::-webkit-details-marker{display:none}
.panel>summary{font-weight:700;display:flex;justify-content:space-between}
.panel>summary::after{content:"＋";color:var(--muted)} .panel[open]>summary::after{content:"－"}
.row{display:grid;gap:8px;margin-top:14px}
.rowhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.lbl{font:600 11px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 13px var(--mono);padding:8px 11px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--fg);min-height:38px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.chip.star[aria-pressed="true"]{background:transparent;border-color:var(--gold);color:var(--gold)}
.link{font:600 13px var(--display);background:none;border:0;color:var(--accent);padding:4px 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font:700 12px var(--mono);padding:7px 14px;border:0;background:transparent;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--panel)}
.maedit{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.maedit input{min-width:0;font:600 15px var(--mono);padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);text-align:center}
.note{font-size:12.5px;color:var(--muted);margin:14px 0 0}
.scanbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:grid;gap:8px;background:var(--bg);padding:6px 0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#scan{font:800 16px var(--display);padding:14px;border-radius:12px;border:0;background:var(--accent);color:var(--panel);width:100%}
#scan:disabled,.search button:disabled{opacity:.6}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.status{font:12px var(--mono);color:var(--muted)}
.status.err{color:var(--bear)}
.tools{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.auto{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
#results{display:grid;gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px}
.card.conf{border-color:var(--gold)}
.csum{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px}
.csum::after{content:"▾";color:var(--muted);font-size:14px;transition:transform .15s}
.card[open]>.csum::after{transform:rotate(180deg)}
.cl{display:grid;gap:6px;min-width:0;flex:1}
.sym{font:800 18px var(--display)}
.sym small{font:600 12px var(--mono);color:var(--muted);margin-left:8px}
.sub{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cbody{display:grid;gap:10px;padding:0 14px 14px}
.pill{font:700 12px var(--display);padding:3px 9px;border-radius:999px;white-space:nowrap;display:inline-block}
.pill.bull{color:var(--bull);background:var(--bullbg)} .pill.bear{color:var(--bear);background:var(--bearbg)} .pill.flat{color:var(--muted);background:var(--bg)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.swp{display:inline-block;font:700 10.5px/1.5 var(--mono);padding:0 5px;border-radius:5px;margin-left:3px;vertical-align:1px}
.swp.up{color:var(--bull);background:var(--bullbg)} .swp.down{color:var(--bear);background:var(--bearbg)} .swp.eq{color:var(--gold);background:var(--goldbg)}
.rec.gold{color:var(--gold)}
.schip[data-pop],.tag[data-pop]{cursor:pointer}
.pop{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:60;padding:0}
.pop[hidden]{display:none}
.popc{position:relative;background:var(--panel);color:var(--fg);width:min(520px,100%);max-height:80vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px 20px;border:1px solid var(--line)}
.popx{position:absolute;top:8px;right:10px;border:0;background:transparent;color:var(--muted);font-size:24px;line-height:1;cursor:pointer;min-height:auto;padding:4px 8px}
.poph{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:14px;margin:0 30px 12px 0}.poph .schip{margin-left:auto}
.pr2{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.pr2 b{font-weight:600}.pr2 .pos{color:var(--bull)}.pr2 .neg{color:var(--bear)}.pr2 .mu{color:var(--gold)}
@media(min-width:640px){.pop{align-items:center}.popc{border-radius:16px}}
.donebn{display:grid;gap:2px;border-radius:8px;padding:8px 10px;margin:6px 0;font-size:12.5px;background:var(--bg)}
.donebn b{font:800 13px var(--display)}.donebn.bull{background:var(--bullbg)}.donebn.bull b{color:var(--bull)}
.donebn.bear{background:var(--bearbg)}.donebn.bear b{color:var(--bear)}.donebn span{color:var(--muted)}
.dim{opacity:.55}
.inv{display:grid;gap:4px;font-size:12.5px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.inv>b{font:700 12px var(--display);color:var(--muted)}.inv>div{display:flex;gap:8px;align-items:baseline}.inv>div>b{width:14px;flex:none}
.inv .ok>b{color:var(--bull)}.inv .no>b{color:var(--bear)}.inv .no span{color:var(--gold)}
.lq{display:grid;gap:3px;font:12px var(--mono)}
.lqh{display:flex;justify-content:space-between;color:var(--muted);font:600 11.5px var(--display);padding:2px 0}
.lqr{display:grid;grid-template-columns:72px 48px 1fr 56px;gap:8px;align-items:center}
.lqr>span:last-child{text-align:right}
.lqb{height:10px;border-radius:3px;background:var(--bg);overflow:hidden}.lqb i{display:block;height:100%;border-radius:3px}
.lqr.up .lqb i{background:var(--bull)}.lqr.dn .lqb i{background:var(--bear)}
.lqr.now{color:var(--accent);font-weight:700;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);padding:3px 0}
.tfbody.sbody{gap:3px;font:12px/1.45 var(--mono);color:var(--muted)}
.legend{font-size:11.5px;line-height:1.45;color:var(--muted);padding-top:4px}
.x-struct .tfrow+.tfrow{margin-top:6px}
.x-struct .th{align-items:center}
.tag{font:600 11px var(--mono);padding:2px 7px;border-radius:5px;background:var(--bg);color:var(--muted)}
.tag.gold{color:var(--gold);background:var(--goldbg)}
.tag.bull{color:var(--bull);background:var(--bullbg)} .tag.bear{color:var(--bear);background:var(--bearbg)}
.schip{font:700 12px var(--display);padding:5px 9px;border-radius:8px;white-space:nowrap;border:1px solid currentColor}
.schip b{font:800 15px var(--display)}
.schip.bull{color:var(--bull)} .schip.gold{color:var(--gold)} .schip.bear{color:var(--bear)}
.score{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:10px;border-radius:10px;border:1px solid var(--line)}
.score.bull{border-color:var(--bull)} .score.gold{border-color:var(--gold)} .score.bear{border-color:var(--bear)}
.sn b{font:800 30px/1 var(--display);font-variant-numeric:tabular-nums}
.sn small{font:600 12px var(--mono);color:var(--muted)}
.score.bull .sn b{color:var(--bull)} .score.gold .sn b{color:var(--gold)} .score.bear .sn b{color:var(--bear)}

.why{display:grid;gap:2px;font-size:12.5px}
.why .neg{color:var(--muted)}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.m{min-width:0}
.m .k{font:600 10px var(--display);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.m .v{font:600 13px var(--mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.m .s{font:11px/1.3 var(--display);color:var(--muted)}
.v.pos{color:var(--bull)} .v.neg{color:var(--bear)}
.timing{font:12px var(--mono);background:var(--bg);border-radius:10px;padding:8px 10px;display:grid;gap:2px}
.sec,.tfrow{border:1px solid var(--line);border-radius:10px}
.sec>summary{padding:10px 12px;font:700 13px var(--display);color:var(--accent);display:flex;justify-content:space-between}
.sec>summary::after,.tfrow>summary::after{content:"▾";color:var(--muted);transition:transform .15s}
.sec[open]>summary::after,.tfrow[open]>summary::after{transform:rotate(180deg)}
.secbody{display:grid;gap:10px;padding:0 12px 12px;min-width:0}
.tfrow>summary{display:flex;align-items:center;gap:10px;padding:9px 11px}
.tfrow>summary::after{margin-left:auto}
.tflab{font:700 14px var(--mono);color:var(--accent);min-width:34px}
.th{display:flex;flex-wrap:wrap;gap:4px;min-width:0}
.tfrow>summary .schip{margin-left:auto}
.tfbody{display:grid;gap:8px;padding:0 11px 11px;min-width:0}
.lvcols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lvl{display:flex;justify-content:space-between;gap:6px;font:12.5px var(--mono);font-variant-numeric:tabular-nums;padding:5px 0;border-bottom:1px solid var(--line)}
.mu{color:var(--muted)} .small{font-size:12px;margin-top:6px}
.vpwrap{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.vp{display:grid;gap:1px;padding:2px 0;border-left:1px solid var(--line)}
.vprow{height:4px;position:relative}
.vprow i{display:block;height:100%;background:var(--line);border-radius:0 2px 2px 0}
.vprow i.va{background:var(--va)} .vprow i.poc{background:var(--accent)}
.vprow.now::after{content:"";position:absolute;left:0;right:0;top:1px;height:2px;background:var(--fg)}
.links{display:flex;justify-content:space-between;gap:8px}
.links a{font:600 13px var(--display);color:var(--accent);text-decoration:none}
.empty{text-align:center;color:var(--muted);padding:20px 10px}
.ahead{font-size:13.5px;color:var(--muted);margin:0 2px 10px}.ahead b{color:var(--bull)}
.near{margin-top:4px}.near.risk>summary{color:var(--gold)}.near>.secbody{gap:10px;padding:0 8px 8px}
.tag.aplus{color:var(--bull);background:var(--bullbg);font-weight:800}
.pill.gold{color:var(--gold);background:var(--goldbg)}
.chk{gap:6px;font-size:13px}.chk>div{display:flex;gap:8px;align-items:baseline}.chk b{width:14px;flex:none}
.chk .ok b{color:var(--bull)}.chk .no b{color:var(--bear)}.chk .no span{color:var(--muted)}.chk .part b{color:var(--gold)}
button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:420px){.plan{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(2,1fr)}}

<script>
// ---------- settings ----------
const ALL_TF=["1m","3m","5m","15m","30m","1h","2h","4h","6h","8h","12h","1d","3d","1w","1M"];
const TF_MIN={"1m":1,"3m":3,"5m":5,"15m":15,"30m":30,"1h":60,"2h":120,"4h":240,"6h":360,"8h":480,"12h":720,"1d":1440,"3d":4320,"1w":10080,"1M":43200};
const OKX_BAR={"1m":"1m","3m":"3m","5m":"5m","15m":"15m","30m":"30m","1h":"1H","2h":"2H","4h":"4H","6h":"6Hutc","12h":"12Hutc","1d":"1Dutc","3d":"3Dutc","1w":"1Wutc","1M":"1Mutc"};
const STD_MA=[9,21,50,200];
const TOP_N=50,VOL_MULT=1.5,VOL_LEN=20,MAX_FAV=10;
let S={favs:["15m","1h","4h","1d","1w"],tfs:["1h","4h","1d"],maType:"ema",slots:[...STD_MA],periods:[...STD_MA],off:[],theme:"auto",pal:"teal",entry:"close",stopMode:"wick"};
const okP=v=>{const n=Number(v);return v!==""&&v!=null&&Number.isInteger(n)&&n>=2&&n<=300?n:null;};
const fromSlots=sl=>[...new Set(sl.filter(n=>n!=null))].sort((x,y)=>x-y);
try{
  const o=JSON.parse(localStorage.getItem("cgrab")||"{}");
  if(Array.isArray(o.favs))S.favs=o.favs.filter(t=>ALL_TF.includes(t)).slice(0,MAX_FAV);
  if(Array.isArray(o.tfs))S.tfs=o.tfs.filter(t=>S.favs.includes(t));
  if(o.maType==="ema"||o.maType==="sma")S.maType=o.maType;
  if(Array.isArray(o.slots)&&o.slots.length===4){const sl=o.slots.map(okP);if(sl.some(n=>n!=null)){S.slots=sl;S.periods=fromSlots(sl);}}
  if(["auto","light","dark"].includes(o.theme))S.theme=o.theme;
  if(["close","pullback","breakout","sweep"].includes(o.entry))S.entry=o.entry;
  if(["wick","close"].includes(o.stopMode))S.stopMode=o.stopMode;
  if(["teal","blue","violet","amber","rose"].includes(o.pal))S.pal=o.pal;
  if(Array.isArray(o.off))S.off=o.off.filter(p=>S.periods.includes(p));
}catch(e){}
const save=()=>{try{const {periods,...keep}=S;localStorage.setItem("cgrab",JSON.stringify(keep));}catch(e){}};
const $=id=>document.getElementById(id);
const sortTf=a=>a.slice().sort((x,y)=>ALL_TF.indexOf(x)-ALL_TF.indexOf(y));
const maName=()=>S.maType==="ema"?"EMA":"MA";

function renderTf(){
  const box=$("tfChips");box.textContent="";
  if(!S.favs.length){box.innerHTML='<span class="status">No favorites yet. Tap Edit favorites.</span>';}
  for(const tf of sortTf(S.favs)){
    const b=document.createElement("button");b.className="chip";b.textContent=tf;b.setAttribute("aria-pressed",S.tfs.includes(tf));
    b.onclick=()=>{S.tfs=S.tfs.includes(tf)?S.tfs.filter(x=>x!==tf):[...S.tfs,tf];save();renderTf();};
    box.appendChild(b);
  }
  if(typeof renderBtTf==="function"&&window.BT_READY)renderBtTf();
  const all=$("tfAll");all.textContent="";
  for(const tf of ALL_TF){
    const fav=S.favs.includes(tf);
    const b=document.createElement("button");b.className="chip star";b.textContent=(fav?"★ ":"☆ ")+tf;b.setAttribute("aria-pressed",fav);
    b.onclick=()=>{
      if(fav){S.favs=S.favs.filter(x=>x!==tf);S.tfs=S.tfs.filter(x=>x!==tf);}
      else{if(S.favs.length>=MAX_FAV){setStatus("You can keep 10 favorite timeframes. Remove one first.",true);return;}S.favs=[...S.favs,tf];}
      save();renderTf();
    };
    all.appendChild(b);
  }
}
$("editTf").onclick=()=>{const e=$("tfEdit");e.hidden=!e.hidden;$("editTf").textContent=e.hidden?"Edit favorites":"Done";};
function renderMa(){
  document.querySelectorAll("[data-ma]").forEach(x=>x.setAttribute("aria-pressed",S.maType===x.dataset.ma));
  [0,1,2,3].forEach(i=>{$("ma"+i).value=S.slots[i]??"";});
  updResets();
}
document.querySelectorAll("[data-ma]").forEach(b=>b.onclick=()=>{S.maType=b.dataset.ma;save();renderMa();});
$("editMa").onclick=()=>{const e=$("maEdit");e.hidden=!e.hidden;$("editMa").textContent=e.hidden?"Customize periods":"Close";};
// a reset icon shows only on a box whose value differs from the standard 9 / 21 / 50 / 200
function updResets(){document.querySelectorAll(".rs").forEach(b=>{const i=+b.dataset.i;b.hidden=okP($("ma"+i).value)===STD_MA[i];});}
[0,1,2,3].forEach(i=>$("ma"+i).addEventListener("input",updResets));
function applySlots(sl,msg){
  if(!sl.some(n=>n!=null)){setStatus("Enter at least one period between 2 and 300.",true);return;}
  S.slots=sl;S.periods=fromSlots(sl);S.off=S.off.filter(p=>S.periods.includes(p));save();renderMa();if(msg)setStatus(msg);
}
const readSlots=()=>[0,1,2,3].map(i=>okP($("ma"+i).value));
$("saveMa").onclick=()=>{const sl=readSlots();applySlots(sl,`Saved: ${maName()} ${fromSlots(sl).join(" · ")}`);};
document.querySelectorAll(".rs").forEach(b=>b.onclick=()=>{
  const i=+b.dataset.i,sl=readSlots();sl[i]=STD_MA[i];applySlots(sl,null);setStatus("");
});

// ---------- entry method ----------
function renderEntry(){
  document.querySelectorAll("[data-stop]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.stop===S.stopMode));
}
document.querySelectorAll("[data-stop]").forEach(b=>b.onclick=()=>{S.stopMode=b.dataset.stop;save();renderEntry();
  setStatus("Stop type changed. Scan or check again to apply it.");});
renderEntry();

// ---------- appearance ----------
function applyLook(){
  const r=document.documentElement;
  if(S.theme==="auto")delete r.dataset.theme;else r.dataset.theme=S.theme;
  if(S.pal==="teal")delete r.dataset.pal;else r.dataset.pal=S.pal;
  document.querySelectorAll("[data-theme-opt]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.themeOpt===S.theme));
  document.querySelectorAll("#pal .sw").forEach(x=>x.setAttribute("aria-pressed",x.dataset.pal===S.pal));
}
document.querySelectorAll("[data-theme-opt]").forEach(b=>b.onclick=()=>{S.theme=b.dataset.themeOpt;save();applyLook();});
document.querySelectorAll("#pal .sw").forEach(b=>b.onclick=()=>{S.pal=b.dataset.pal;save();applyLook();});
applyLook();
$("gear").onclick=()=>{const p=$("settings");p.hidden=!p.hidden;$("gear").setAttribute("aria-expanded",!p.hidden);};

// ---------- indicators ----------
function ema(a,n){const k=2/(n+1),o=[a[0]];for(let i=1;i<a.length;i++)o.push(a[i]*k+o[i-1]*(1-k));return o;}
function sma(a,n){const o=new Array(a.length).fill(NaN);let s=0;for(let i=0;i<a.length;i++){s+=a[i];if(i>=n)s-=a[i-n];if(i>=n-1)o[i]=s/n;}return o;}
function rsi(c,n=14){
  const o=new Array(c.length).fill(50);let g=0,l=0;const al=1/n;
  for(let i=1;i<c.length;i++){const d=c[i]-c[i-1];
    g=g*(1-al)+Math.max(d,0)*al; l=l*(1-al)+Math.max(-d,0)*al;
    o[i]=l===0?100:100-100/(1+g/l);}
  return o;
}
function macdHist(c){const a=ema(c,12),b=ema(c,26),line=a.map((v,i)=>v-b[i]),sig=ema(line,9);return line.map((v,i)=>v-sig[i]);}
function atr(d,n=14){
  const o=[d.high[0]-d.low[0]];
  for(let i=1;i<d.close.length;i++){
    const tr=Math.max(d.high[i]-d.low[i],Math.abs(d.high[i]-d.close[i-1]),Math.abs(d.low[i]-d.close[i-1]));
    o.push(o[i-1]+(tr-o[i-1])/n);
  }
  return o;
}
function pivots(v,L,R,kind){
  const out=[];
  for(let i=L;i<v.length-R;i++){
    const w=v.slice(i-L,i+R+1);
    const ext=kind==="low"?Math.min(...w):Math.max(...w);
    if(v[i]===ext&&w.indexOf(ext)===L)out.push(i);
  }
  return out;
}
// maxAge keeps a signal in the scan for its whole entry window: 3 candles to confirm + up to 8 for a sweep entry.
const CFG={L:5,R:3,minGap:5,maxGap:60,maxAge:11,trigger:5,sweepWin:8};
function divergences(d){
  const n=d.close.length,found=[];
  const check=(piv,kind)=>{
    if(piv.length<2)return;const b=piv[piv.length-1];
    if(n-1-b>CFG.maxAge)return;
    for(let j=piv.length-2;j>=0;j--){const a=piv[j],gap=b-a;
      if(gap<CFG.minGap)continue; if(gap>CFG.maxGap)break;
      const P=kind==="low"?d.low:d.high, r=d.rsi; let t=null;
      if(kind==="low"){ if(P[b]<P[a]&&r[b]>r[a])t="regular_bull"; else if(P[b]>P[a]&&r[b]<r[a])t="hidden_bull"; }
      else{ if(P[b]>P[a]&&r[b]<r[a])t="regular_bear"; else if(P[b]<P[a]&&r[b]>r[a])t="hidden_bear"; }
      if(!t)continue;
      found.push({type:t,p1:P[a],p2:P[b],r1:r[a],r2:r[b],ago:n-1-b,time:d.time[b],bi:b,gap});
      return;
    }
  };
  check(pivots(d.low,CFG.L,CFG.R,"low"),"low");
  check(pivots(d.high,CFG.L,CFG.R,"high"),"high");
  return found;
}
// ---------- market structure ----------
// Swings are confirmed pivots (5 candles left, 3 right), so each one is known 3 candles after it forms.
// A close beyond the latest swing is a break: with the trend it is a BOS, against it a CHoCH (the trend flips).
// Two or more CHoCHs within 30 candles means the structure is choppy (range-bound).

    const others=hits.filter(o=>o!==h&&o.tf!==h.tf),tfs=f=>sortTf([...new Set(others.filter(f).map(o=>o.tf))]);
    h.ctx={agree:tfs(o=>dirOf(o.type)===dirOf(h.type)),against:tfs(o=>dirOf(o.type)!==dirOf(h.type))};
    h.sc=scoreHit(h,h.ctx);
  }
  return hits.length?hits.reduce((a,b)=>rankOf(b)>rankOf(a)?b:a):null;
}

// CoinGlass-style model: when open interest rises, new leveraged longs and shorts were opened near that candle's price.
// Spread them over common leverage (5x 10%, 10x 30%, 25x 30%, 50x 20%, 100x 10%), weight longs vs shorts by the
// long/short account ratio, shrink them as open interest later falls (positions closed), and drop any liquidation price
// that price has already traded through. What is left are the pools of liquidations price has not reached yet.

const LIQ_CACHE={};
async function liqMap(base){
  const c=LIQ_CACHE[base];if(c&&Date.now()-c.at<5*60000)return c.m;
  for(const sc of LIQ_SRC){try{const D=await sc.get(base);if(D.oi.length<24||D.k.length<24)continue;
    const m=liqModel(D);if(m){m.src=sc.name;LIQ_CACHE[base]={at:Date.now(),m};return m;}}catch(e){}}
  return null;
}
function liqModel(D){
  const K=D.k.sort((a,b)=>a.t-b.t),O=D.oi.sort((a,b)=>a.t-b.t),n=K.length,m=O.length,at=new Map(K.map((x,i)=>[x.t,i]));
  const px=K[n-1].c,mnL=new Array(n+1).fill(Infinity),mxH=new Array(n+1).fill(-Infinity);
  for(let i=n-1;i>=0;i--){mnL[i]=Math.min(K[i].l,mnL[i+1]);mxH[i]=Math.max(K[i].h,mxH[i+1]);}
  const surv=new Array(m).fill(1);let run=1;
  for(let i=m-1;i>=1;i--){surv[i]=run;const r=O[i].v/O[i-1].v;if(r<1)run*=r;}
  const LS=D.ls.sort((a,b)=>a.t-b.t);let li=0;
  const step=px*0.0025,bins={},add=(p,usd,side)=>{if(Math.abs(p/px-1)>0.25)return;const k=Math.round((p-px)/step);(bins[k]=bins[k]||{p:px+k*step,long:0,short:0})[side]+=usd;};
  for(let i=1;i<m;i++){const d=O[i].v-O[i-1].v;if(!(d>0))continue;
    const ci=at.has(O[i-1].t)?at.get(O[i-1].t):at.get(O[i].t);if(ci==null)continue;
    while(li+1<LS.length&&LS[li+1].t<=O[i].t)li++;const lf=LS.length&&LS[li].t<=O[i].t&&LS[li].f>0&&LS[li].f<1?LS[li].f:0.5;
    const c=K[ci],e=(c.h+c.l+c.c)/3,usd=d*e*surv[i];
    for(const [lev,w] of LIQ_LEV){
      const pl=e*(1-1/lev+LIQ_MMR),ps=e*(1+1/lev-LIQ_MMR);
      if(mnL[ci+1]>pl)add(pl,usd*w*2*lf,"long");
      if(mxH[ci+1]<ps)add(ps,usd*w*2*(1-lf),"short");
    }
  }
  const B=Object.entries(bins).map(([k,b])=>({k:+k,...b}));
  const peaks=side=>{const arr=B.filter(b=>side==="long"?b.k<0&&b.long>0:b.k>0&&b.short>0).map(b=>({k:b.k,v:b[side]}));
    const val=k=>arr.filter(b=>Math.abs(b.k-k)<=2).reduce((a,b)=>a+b.v,0),out=[];
    for(const b of [...arr].sort((a,b)=>b.v-a.v)){if(out.length>=4)break;if(out.some(o=>Math.abs(o.k-b.k)<=4))continue;
      const v=val(b.k);out.push({k:b.k,p:px+b.k*step,usd:v,dist:(b.k*step)/px*100});}
    const mx=Math.max(0,...out.map(o=>o.usd));return out.filter(o=>o.usd>=mx*0.15).sort((a,b)=>Math.abs(a.k)-Math.abs(b.k));};
  const above=peaks("short"),below=peaks("long");
  const near=(arr,side)=>B.filter(b=>Math.abs(b.k*step/px)<=0.05).reduce((a,b)=>a+(side==="long"?(b.k<0?b.long:0):(b.k>0?b.short:0)),0);
  const up5=near(above,"short"),dn5=near(below,"long");
  // Pull = size over distance: a big pool close to price usually gets taken first
  const pull=arr=>arr.reduce((a,o)=>Math.max(a,o.usd/(Math.abs(o.dist)+0.5)),0),pu=pull(above),pd=pull(below);
  const magnet=pu>pd*1.25?"above":pd>pu*1.25?"below":"both";
  return {px,above,below,up5,dn5,magnet,hours:Math.round((O[m-1].t-O[0].t)/3600e3)};
}
const usdTxt=v=>v>=1e9?`$${(v/1e9).toFixed(1)}B`:v>=1e6?`$${(v/1e6).toFixed(0)}M`:v>=1e3?`$${(v/1e3).toFixed(0)}K`:`$${v.toFixed(0)}`;
function liqHTML(L,t,st){

  const big=L.magnet==="above"?L.above[0]&&[...L.above].sort((a,b)=>b.usd/(Math.abs(b.dist)+.5)-a.usd/(Math.abs(a.dist)+.5))[0]:L.magnet==="below"?[...L.below].sort((a,b)=>b.usd/(Math.abs(b.dist)+.5)-a.usd/(Math.abs(a.dist)+.5))[0]:null;

    h+=`<div class="eod">Stops resting above (buy-side): ${bs.join(" · ")||"none"}<br>Stops resting below (sell-side): ${ss.join(" · ")||"none"}</div>`;}

async function binEnding(id,tf,endTs,count){

async function okxEnding(id,tf,endTs,count){

// Trade rules: entry must trigger within the trigger window; half closes at T1 and the stop moves to entry;
// the rest closes at T2. Stop and target in the same candle counts as the stop. Open trades are marked to market.
// Two-part order block entry: half fills at e1, the rest at e2; R is measured against the full planned position.
// Half the open position is taken at Target 1 (stop to the average entry), the rest at Target 2.
function simulateOB(lv,bull,fwd,fee){
  const o={trig:-1,t1:-1,t2:-1,stop:-1,fill:0},dir=bull?1:-1,win=CFG.trigger;
  const reach=(c,p)=>bull?c.h>=p:c.l<=p,back=(c,p)=>bull?c.l<=p:c.h>=p,closedPast=(c,p)=>bull?c.c<p:c.c>p;
  const Rf=Math.abs(lv.entry-lv.stop);let f=0,avg=0,i0=0;
  const add=(p,q)=>{avg=(avg*f+p*q)/(f+q);f+=q;};
  if(lv.atClose){add(lv.e1,lv.split?0.5:1);o.trig=0;o.atClose=true;}
  else{
    for(let i=0;i<Math.min(win,fwd.length);i++){const c=fwd[i];
      if(back(c,lv.e1)){add(lv.e1,lv.split?0.5:1);o.trig=i;i0=i;break;}
      if(reach(c,lv.t1)){o.missed=true;o.missT=c.t;break;}
      if(closedPast(c,lv.pivot)){o.failed=true;o.failT=c.t;break;}}
    if(o.trig<0){o.status=o.missed||o.failed?"no_trigger":fwd.length<win?"pending":"no_trigger";o.r=0;o.done=false;return o;}
  }
  let stopLvl=lv.stop,real=0,rem=f;const end=Math.min(fwd.length,o.trig+200),hard=lvl=>lvl-dir*0.5*Rf;
  for(let i=i0;i<end;i++){const c=fwd[i];
    if(f<1&&o.t1<0&&back(c,lv.e2)){add(lv.e2,1-f);rem=f;o.tt2=c.t;}
    let px=null;
    if(lv.stopMode==="close"){if(back(c,hard(stopLvl)))px=hard(stopLvl);else if(closedPast(c,stopLvl))px=c.c;}
    else if(back(c,stopLvl)){px=stopLvl;o.wick=!closedPast(c,stopLvl);}
    if(px!=null){real+=rem*(px-avg)*dir;rem=0;o.stop=i;break;}
    if(o.t1<0&&reach(c,lv.t1)){const q=rem/2;real+=q*(lv.t1-avg)*dir;rem-=q;o.t1=i;stopLvl=avg;}
    if(o.t1>=0&&reach(c,lv.t2)){real+=rem*(lv.t2-avg)*dir;rem=0;o.t2=i;break;}
  }
  const last=fwd[Math.max(0,end-1)],mtm=rem>0&&last?rem*(last.c-avg)*dir:0;
  o.status=o.t2>=0?"t2":o.stop>=0?(o.t1>=0?"t1_be":"stopped"):(end-o.trig>=200?"timeout":"open");
  o.r=(real+(o.status==="open"||o.status==="timeout"?mtm:0))/Rf-fee/lv.riskPct*f;
  o.done=o.status!=="open";o.fill=f;o.avg=avg;
  const tm=k=>k>=0&&fwd[k]?fwd[k].t:null;o.tt=tm(o.trig);o.t1t=tm(o.t1);o.t2t=tm(o.t2);o.st=tm(o.stop);
  return o;
}
function simulate(lv,bull,fwd,fee){
  if(lv.method==="ob")return simulateOB(lv,bull,fwd,fee);
  const R=Math.abs(lv.entry-lv.stop),dir=bull?1:-1,o={trig:-1,t1:-1,t2:-1,stop:-1};
  const reach=(c,p)=>bull?c.h>=p:c.l<=p, back=(c,p)=>bull?c.l<=p:c.h>=p, closedPast=(c,p)=>bull?c.c<p:c.c>p;
  const win=lv.method==="sweep"?CFG.sweepWin:CFG.trigger;

function adxCalc(d,n=14){
  const N=d.close.length,adx=new Array(N).fill(NaN),pdi=new Array(N).fill(NaN),mdi=new Array(N).fill(NaN);
  let tr=0,pd=0,md=0,ax=null;const a=1/n;
  for(let i=1;i<N;i++){
    const up=d.high[i]-d.high[i-1],dn=d.low[i-1]-d.low[i];
    const t=Math.max(d.high[i]-d.low[i],Math.abs(d.high[i]-d.close[i-1]),Math.abs(d.low[i]-d.close[i-1]));
    tr=tr*(1-a)+t*a;pd=pd*(1-a)+(up>dn&&up>0?up:0)*a;md=md*(1-a)+(dn>up&&dn>0?dn:0)*a;
    if(!tr)continue;pdi[i]=100*pd/tr;mdi[i]=100*md/tr;
    const dx=pdi[i]+mdi[i]?100*Math.abs(pdi[i]-mdi[i])/(pdi[i]+mdi[i]):0;
    ax=ax==null?dx:ax*(1-a)+dx*a;adx[i]=ax;
  }
  return {adx,pdi,mdi};
}

  const s=Math.max(0,L-29);let hi=-Infinity,lo=Infinity;for(let i=s;i<=L;i++){hi=Math.max(hi,d.high[i]);lo=Math.min(lo,d.low[i]);}
  const r={adx:a,vs50:(c/e50[L]-1)*100,up:A.pdi[L]>A.mdi[L],st,range:[lo,hi]};
  if(st.chop||a<18||!st.trend)Object.assign(r,{state:"Range-bound",cls:"side"});

}

  let bias,exp,inv;

// ---------- live prices: refresh every 3 seconds while the page is open ----------
const LIVE={};
// Binance coins stream through a websocket (about one update per second, like the Binance app);
// polling every 3 seconds is the fallback, and the only source for OKX coins.
let ws=null,wsKey="",wsAlive=0,paintQueued=false;
function closeWS(){try{if(ws)ws.close();}catch(e){}ws=null;wsKey="";}
function ensureWS(bin){
  const key=bin.slice().sort().join(",");
  if(!bin.length){closeWS();return;}
  if(key===wsKey&&ws&&ws.readyState<=1)return;
  closeWS();wsKey=key;
  try{
    ws=new WebSocket(`wss://data-stream.binance.vision/stream?streams=${bin.map(i=>i.toLowerCase()+"@miniTicker").join("/")}`);
    ws.onmessage=ev=>{try{const m=JSON.parse(ev.data).data;LIVE[m.s]=+m.c;wsAlive=Date.now();
      if(!paintQueued){paintQueued=true;requestAnimationFrame(()=>{paintQueued=false;paintLive();});}}catch(e){}};
    ws.onclose=()=>{ws=null;wsKey="";};
  }catch(e){ws=null;wsKey="";}
}
async function pollLive(){
  if(document.hidden||MODE!=="live"){closeWS();return;}
  const ids=[...new Set([...document.querySelectorAll("[data-live]")].map(e=>e.dataset.live))];
  const bin=ids.filter(i=>!i.includes("-")),okx=ids.filter(i=>i.includes("-"));
  ensureWS(bin);
  if(!ids.length)return;
  try{if(bin.length&&Date.now()-wsAlive>5000){const r=await fetch(`https://data-api.binance.vision/api/v3/ticker/price?symbols=${encodeURIComponent(JSON.stringify(bin))}`);
    if(r.ok)for(const x of await r.json())LIVE[x.symbol]=+x.price;}}catch(e){}
  await Promise.all(okx.map(async id=>{try{const j=await (await fetch(`https://www.okx.com/api/v5/market/ticker?instId=${id}`)).json();if(j.data&&j.data[0])LIVE[id]=+j.data[0].last;}catch(e){}}));
  paintLive();
}
// ---------- live trade tracking ----------
// Each live price tick updates the forming candle (high/low/close) of every signal on screen and re-runs its entry,
// stop and target checks, so a fill, a missed move, Target 1 or a stop shows up immediately instead of at the next scan.
let LIVE_HITS=[];
const trkSig=o=>o?[o.status,o.trig,o.t1,o.t2,o.stop,o.missed,o.failed,o.deep].join(","):"";
function liveTrack(){
  LIVE_HITS=LIVE_HITS.filter(r=>r.el.isConnected);
  for(const r of LIVE_HITS){
    const h=r.h,p=LIVE[h.id];if(p==null||!h.after||!h.lv)continue;
    const ms=TF_MS(h.tf),now=Date.now(),a=h.after,before=trkSig(h.track)+"|"+a.length;
    let last=a[a.length-1];
    if(!last){if(now<h.sigTime)continue;last={t:h.sigTime+Math.floor((now-h.sigTime)/ms)*ms,h:p,l:p,c:p};a.push(last);}
    else if(now>=last.t+ms){last={t:last.t+Math.floor((now-last.t)/ms)*ms,h:p,l:p,c:p};a.push(last);}
    else{last.h=Math.max(last.h,p);last.l=Math.min(last.l,p);last.c=p;}
    h.live=p;track(h);
    if(trkSig(h.track)+"|"+a.length===before)continue;
    const k=sigKey(h);
    if(unfilledOf(h)){if(r.top)r.el.hidden=true;else r.el.querySelectorAll(`[data-sk="${CSS.escape(k)}"]`).forEach(w=>{const row=w.closest(".tfrow");(row||w).hidden=true;});continue;}
    r.el.querySelectorAll(`[data-sk="${CSS.escape(k)}"]`).forEach(w=>{
      const open=[...w.querySelectorAll("details")].map(d=>d.open),tmp=document.createElement("div");tmp.innerHTML=signalHTML(h);
      const nw=tmp.firstElementChild;[...nw.querySelectorAll("details")].forEach((d,i)=>{if(open[i])d.open=true;});w.replaceWith(nw);});
    r.el.querySelectorAll(`[data-tp="${CSS.escape(k)}"]`).forEach(x=>x.innerHTML=trackPill(h));
    if(r.top){h.chk=checklist(h);
      const ce=r.el.querySelector("details.x-check");if(ce){const tmp=document.createElement("div");tmp.innerHTML=checkHTML(h.chk,h.sc);const nc=tmp.firstElementChild;nc.open=ce.open;ce.replaceWith(nc);}
      const tg=r.el.querySelector("[data-ckt]");if(tg)tg.innerHTML=ckTag(h.chk,k);}
  }
}
